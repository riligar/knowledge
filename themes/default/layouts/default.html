<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} - {{site.title}}</title>
    <meta name="description" content="{{site.description}}">
    <meta name="author" content="{{site.author}}">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{site.baseUrl}}">
    <meta property="og:title" content="{{title}} - {{site.title}}">
    <meta property="og:description" content="{{site.description}}">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="{{site.baseUrl}}">
    <meta property="twitter:title" content="{{title}} - {{site.title}}">
    <meta property="twitter:description" content="{{site.description}}">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{baseUrl}}favicon.ico">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="{{baseUrl}}assets/css/style.css">
    <link rel="stylesheet" href="{{baseUrl}}assets/css/highlight.css">
    <link rel="stylesheet" href="{{baseUrl}}assets/css/search.css">
    <link rel="stylesheet" href="{{baseUrl}}assets/css/page-highlighter.css">
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <!-- Logo/Title -->
            <div class="header-left">
                <!-- Mobile Menu Button -->
                <button class="mobile-menu-toggle" aria-label="Toggle navigation menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>

                <h1 class="site-title">
                    <a href="{{baseUrl}}">{{site.title}}</a>
                </h1>
            </div>

            <!-- Search Bar -->
            <div class="header-center">
                <div class="search-container search-enhanced">
                    <input type="text" class="search-input" id="global-search"
                        placeholder="Buscar na documentação... (Ctrl+K)" autocomplete="off">
                    <button class="search-button" type="button" aria-label="Buscar">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                            <path
                                d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Right side (for future elements like theme toggle, etc.) -->
            <div class="header-right">
                <div class="header-actions">
                    <a href="https://github.com/riligar/knowledge" target="_blank" class="header-action-btn github-link"
                        title="Ver no GitHub" aria-label="Ver repositório no GitHub">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="icon icon-tabler icons-tabler-outline icon-tabler-brand-github">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path
                                d="M9 19c-4.3 1.4 -4.3 -2.5 -6 -3m12 5v-3.5c0 -1 .1 -1.4 -.5 -2c2.8 -.3 5.5 -1.4 5.5 -6a4.6 4.6 0 0 0 -1.3 -3.2a4.2 4.2 0 0 0 -.1 -3.2s-1.1 -.3 -3.5 1.3a12.3 12.3 0 0 0 -6.2 0c-2.4 -1.6 -3.5 -1.3 -3.5 -1.3a4.2 4.2 0 0 0 -.1 3.2a4.6 4.6 0 0 0 -1.3 3.2c0 4.6 2.7 5.7 5.5 6c-.6 .6 -.6 1.2 -.5 2v3.5" />
                        </svg>
                    </a>

                    <button class="header-action-btn theme-toggle-header" aria-label="Alternar tema escuro/claro"
                        title="Alternar tema">
                        <span class="theme-icon theme-icon-light">☀️</span>
                        <span class="theme-icon theme-icon-dark">🌙</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Layout Container with Flexbox -->
    <div class="main-container">
        <!-- Left Sidebar - Menu Principal -->
        <aside class="main-sidebar">
            <!-- Mobile Header Section -->
            <div class="mobile-sidebar-header">
                <div class="mobile-logo">
                    <!-- <img src="{{baseUrl}}assets/images/k2-logo-ico.png" alt="K2 Logo" class="mobile-logo-img"> -->
                    <h2 class="mobile-title">{{site.title}}</h2>
                </div>
                <!-- Mobile Close Button -->
                <button class="mobile-menu-close" aria-label="Close navigation menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <nav class="navigation" role="navigation" aria-label="Documentation navigation">
                <ul>{{navigation}}</ul>
            </nav>
        </aside>

        <!-- Mobile Overlay -->
        <div class="mobile-overlay"></div>

        <!-- Center Content -->
        <main class="main-content" id="main-content" role="main">
            <div class="content-wrapper">
                <!-- Page Actions -->
                <div class="page-actions">
                    <a href="{{markdownUrl}}" class="download-markdown-btn" title="Download arquivo Markdown" download>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="icon icon-tabler icons-tabler-outline icon-tabler-markdown">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path d="M3 5m0 2a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2z" />
                            <path d="M7 15v-6l2 2l2 -2v6" />
                            <path d="M14 13l2 2l2 -2m-2 2v-6" />
                        </svg>
                    </a>
                </div>

                <article>
                    {{content}}
                </article>
            </div>
        </main>

        <!-- Right Sidebar - Menu do Artigo -->
        <aside class="article-sidebar">
            <div class="content-menu">
                <div class="content-menu-dropdown" id="content-menu-dropdown">
                    <!-- Menu items will be dynamically generated based on page headings -->
                </div>
            </div>
        </aside>
    </div>

    <!-- Scripts -->
    <script src="{{baseUrl}}assets/js/main.js"></script>
    <script src="{{baseUrl}}assets/js/search.js"></script>
    <script src="{{baseUrl}}assets/js/page-highlighter.js"></script>
</body>

</html>
